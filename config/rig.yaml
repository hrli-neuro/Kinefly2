# Rig-level configuration for run_rig.py.
# Camera YAML paths are relative to this file.
# Each camera is an independent system. Entries are a path, or {config: path,
# enabled: false} to leave a camera off; `run_rig --cameras bottom` overrides.
cameras:
  bottom: camera_bottom.yaml   # Bottom view: L/R wing stroke amplitude + head yaw.
  front:                       # Front view: wing-envelope roll + head roll.
    config: camera_front.yaml
    enabled: true
primary: bottom                # This camera's updates drive the merged output.
# How old a secondary camera's state may be before its measurements are logged
# as NaN instead of being repeated. Blank/absent = 5 frame intervals of the
# primary camera (55 ms at 90 Hz). A repeated value is indistinguishable from
# real data downstream; a gap is honest, and <cam>/age records how long it was.
# stale_after_s: 0.055
use_gui: true
zmq_port: 5556                 # Merged fly state published as JSON on tcp://*:5556.
command_port: 5558             # Command socket: experiment scripts start/stop recordings (kinefly2.client).
# Recording settings (data root, video, events port) live in the experiment
# template passed as `run_rig --exp experiments/default.yaml` (default if present).

