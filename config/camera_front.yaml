name: front
camera:
  # Rig (FLIR/Spinnaker) example -- exposure guidance: at 90 fps use an exposure
  # near the frame period (~9000 us) so each frame contains the blurred stroke
  # ENVELOPE (its leading edge = stroke amplitude, what the edge tracker reads).
  # A short exposure (~1000 us) freezes the wing at a random stroke phase instead.
  #   kind: pyspin
  #   serial: "12345678"
  #   fps: 90
  #   exposure_us: 9000
  #   gain_db: 10
  kind: video
  path: /Users/haoruli/Desktop/260819_XHCS_XHCS_017_YAMV_cam2.mp4
  pace: false
  loop: false
tracker:
  invertcolor: false   # Bright head on dark background; auto-detection guesses wrong on this view.
  scale_image: 1.0
  n_edges_max: 1
  rc_background: 1000.0
  wingbeat_min: 180
  wingbeat_max: 220
  head:
    tracker: rotation    # Template rotation search: resolves small head-roll angles (~1 ms/frame).
    search_deg: 8        # Half-range of the rotation search (deg).
    autozero: true
    threshold: 0.0
    feathering: 0.25
    saturation_correction: true
  abdomen:
    tracker: tip
    autozero: true
    threshold: 0.0
    feathering: 0.25
    saturation_correction: true
  left:
    tracker: edge
    autozero: true
    threshold: 0.0
    feathering: 0.25
    saturation_correction: true
  right:
    tracker: edge
    autozero: true
    threshold: 0.0
    feathering: 0.25
    saturation_correction: true
  aux:
    tracker: intensity
    saturation_correction: true
  gui:
    windows: false
    symmetric: false   # Left/right wing regions adjust independently in the GUI.
    axis:
      track: false
      pt1:
        x: 175.0
        y: 50.0
      pt2:
        x: 175.0
        y: 150.0
    head:
      track: true
      subtract_bg: false
      stabilize: false
      hinge:
        x: 130.0
        y: 179.0
      radius_outer: 70.0    # Annulus over the head texture (not the whole ball): r 30-70 px, +-50 deg
      radius_inner: 30.0    # gave r=0.96 vs an independent roll estimate on the 260819 video.
      angle_hi: 0.8727
      angle_lo: -0.8727
    abdomen:
      track: false
      subtract_bg: false
      stabilize: false
      hinge:
        x: 80.0
        y: 182.0
      radius_outer: 10.0
      radius_inner: 5.0
      angle_hi: 3.927
      angle_lo: 2.3562
    left:
      track: false
      subtract_bg: false
      stabilize: false
      hinge:
        x: 73.55654736782802
        y: 157.34164758519393
      radius_outer: 20.0
      radius_inner: 10.0
      angle_hi: -0.7854
      angle_lo: -2.3562
    right:
      track: false
      subtract_bg: false
      stabilize: false
      hinge:
        x: 76.55116190422538
        y: 207.25188985848268
      radius_outer: 20.0
      radius_inner: 10.0
      angle_hi: 2.3562
      angle_lo: 0.7854
    aux:
      track: false
      subtract_bg: false
      center:
        x: 50.0
        y: 50.0
      radius1: 30.0
      radius2: 20.0
      angle: 0.0
