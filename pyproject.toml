[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kinefly2"
version = "0.1.0"
description = "ROS-free real-time tethered-fly kinematics tracker (Kinefly/Benifly port)"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "opencv-python",
    "pyyaml",
    "pyzmq",
    "h5py",
]

[project.optional-dependencies]
# PySpin (FLIR Spinnaker) is not on PyPI: install the spinnaker_python wheel
# from flir.com matching the rig's Python version.
panels = ["pyserial"]
# Kinefly2 Scope (the trace viewer) and the traces figure saved after each
# offline analysis. PySide6 6.12.0 crashes the Scope window on Python 3.10
# ("Fatal Python error: none_dealloc: deallocating None"); 6.11.2 works.
scope = ["PySide6>=6.5,<6.12", "pyqtgraph>=0.13.7"]

[tool.setuptools.packages.find]
include = ["kinefly2*"]
